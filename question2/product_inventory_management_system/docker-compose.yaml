services: 
  server:
    # image: 'nginx:stable-alpine'
    build: 
      context: .
      dockerfile: dockerfiles/nginx.dockerfile
    ports: 
      - '8000:80'
    depends_on:
      - php
      - mysql
  php:
    container_name: php
    build:
      context: ./dockerfiles
      dockerfile: php.dockerfile
      args:
        - UID=1000
        - GID=1000
    volumes:
      - .:/var/www/html:delegated
    depends_on:
      - composer
      - mysql

  mysql:
    image: mysql:5.7
    # environment:
    #   - name=value
    env_file:
      - ./env/mysql.env

  composer:
    build:
      context: ./dockerfiles
      dockerfile: composer.dockerfile
    volumes:
      - .:/var/www/html
    
 
